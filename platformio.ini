; Arcade games for LilyGO TTGO T-Display V1.1 (ESP32 + ST7789 1.14" 135x240)
;
; Pinned to espressif32 6.x (Arduino core 2.0.x): TFT_eSPI is most reliable there.

[env:ttgo-t-display]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; crash backtraces as file:line
upload_speed  = 460800

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI configuration for the T-Display (equivalent to Setup25_TTGO_T_Display.h),
; passed as build flags so you don't have to edit files inside the library.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
